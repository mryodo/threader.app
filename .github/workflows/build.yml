name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build
        run: ./build.sh
        env:
          XCODEFLAGS: CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - name: Zip
        run: ditto -c -k --keepParent build/ThReader.app ThReader.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ThReader
          path: ThReader.zip
